name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # The job name is the required status check in the `Protect main`
    # ruleset: renaming it would block every push until the ruleset is updated.
    name: ESLint + TypeScript
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19. Bump this
    # deliberately, in its own commit, once the job is known to pass there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Must match `engines.node` in package.json, which is also what
          # Vercel reads to pick the runtime.
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # Catches what only fails at compile time (route segment config,
      # `server-only` imports, prerender). No secrets: every route must
      # tolerate a missing NEON_DATABASE_URL at build time.
      - name: Build
        run: npm run build
